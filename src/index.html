<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="High-Performance Code Editor with VS Code-style keyboard shortcuts and real-time event debugging">
    <title>Code Editor — Advanced Keyboard Handling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="6" fill="url(#logoGrad)" />
                    <path d="M8 10L12 14L8 18" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <line x1="14" y1="18" x2="20" y2="18" stroke="white" stroke-width="2" stroke-linecap="round" />
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
                            <stop stop-color="#6366f1" />
                            <stop offset="1" stop-color="#8b5cf6" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="app-title">Code Editor</h1>
            <span class="app-badge">v1.0</span>
        </div>
        <div class="header-right">
            <div class="status-indicator" id="save-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
            <div class="stats-panel">
                <div class="stat" id="stat-history">
                    <span class="stat-label">History</span>
                    <span class="stat-value" id="history-count">1</span>
                </div>
                <div class="stat" id="stat-highlights">
                    <span class="stat-label">Highlights</span>
                    <span class="stat-value" id="highlight-count">0</span>
                </div>
                <div class="stat" id="stat-lines">
                    <span class="stat-label">Lines</span>
                    <span class="stat-value" id="line-count">1</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="app-main">
        <!-- Editor Pane -->
        <section class="editor-pane" data-test-id="editor-container">
            <div class="pane-header">
                <div class="pane-tabs">
                    <div class="pane-tab active">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                            <polyline points="13 2 13 9 20 9" />
                        </svg>
                        <span>untitled.js</span>
                    </div>
                </div>
                <div class="pane-actions">
                    <button class="pane-btn" id="btn-undo" title="Undo (Ctrl+Z)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                        </svg>
                    </button>
                    <button class="pane-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="23 4 23 10 17 10" />
                            <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10" />
                        </svg>
                    </button>
                    <button class="pane-btn" id="btn-save" title="Save (Ctrl+S)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                            <polyline points="17 21 17 13 7 13 7 21" />
                            <polyline points="7 3 7 8 15 8" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="editor-body">
                <div class="line-numbers" id="line-numbers">
                    <span>1</span>
                </div>
                <div class="editor-input" data-test-id="editor-input" id="editor-input" contenteditable="true"
                    role="textbox" aria-multiline="true" aria-label="Code Editor" spellcheck="false" autocorrect="off"
                    autocapitalize="off"></div>
            </div>
            <div class="editor-footer">
                <span class="footer-item" id="cursor-position">Ln 1, Col 1</span>
                <span class="footer-item">JavaScript</span>
                <span class="footer-item">UTF-8</span>
                <span class="footer-item chord-indicator" id="chord-indicator"></span>
            </div>
        </section>

        <!-- Event Dashboard -->
        <section class="dashboard-pane" data-test-id="event-dashboard">
            <div class="pane-header">
                <div class="pane-tabs">
                    <div class="pane-tab active">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                        </svg>
                        <span>Event Log</span>
                    </div>
                </div>
                <div class="pane-actions">
                    <button class="pane-btn" id="btn-clear-log" title="Clear Log">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="dashboard-body" data-test-id="event-log-list" id="event-log-list">
                <!-- Event entries will be added here dynamically -->
            </div>
        </section>
    </main>

    <!-- Keyboard Shortcuts Overlay -->
    <div class="shortcuts-hint" id="shortcuts-hint">
        <span>Ctrl+S Save</span>
        <span>Ctrl+Z Undo</span>
        <span>Ctrl+Shift+Z Redo</span>
        <span>Tab Indent</span>
        <span>Ctrl+/ Comment</span>
        <span>Ctrl+K,C Chord</span>
    </div>

    <script src="editor.js"></script>
    <script src="app.js"></script>
</body>

</html>
